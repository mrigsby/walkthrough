# Walkthrough settings for the demo shop.

# The page that browser_open starts at.
baseUrl: http://localhost:4321

# Sites that Walkthrough may open. Anything else is blocked.
allowedOrigins:
  - http://localhost:4321

# Values for {{var:NAME}} in plans. An environment can change them.
vars:
  userName: Demo User

# Other copies of the shop, to run the same plans there.
# Start them with "npm run demo:staging" and "npm run demo:production".
# Put their passwords in .walkthrough/.env.staging and .walkthrough/.env.production.
environments:
  staging:
    baseUrl: http://staging.localhost:4322
    vars:
      userName: Staging User
  production:
    baseUrl: http://prod.localhost:4323
    # Production is protected: Walkthrough asks you before it works there.
    vars:
      userName: Production User

# How to answer confirm and prompt dialogs: ask (default), accept, or dismiss.
dialogs: ask

# Show the Pass, Bug, Skip, and Stop panel in the browser.
panel: true

# Show a box on each element for this many milliseconds before the agent uses it.
highlightMs: 600

# How long ask_developer waits for an answer before it tells the agent to wait again.
# askTimeoutSec: 300

# Browser options.
browser:
  # Set to true to hide the browser window.
  headless: false
  # Wait this many milliseconds between browser steps, so you can watch each step.
  slowMo: 0

# Put personal settings in config.local.yaml. Git does not track that file.
# Only that file can turn on the evaluate tool (allowEvaluate: true)
# or change the upload folder (uploadsRoot).
