<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Payment</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="frame-body">
    <form id="payment-form" class="stack">
      <h2>Card details</h2>
      <!-- Planted accessibility issue: this field has no label. -->
      <p class="field-name">Name on card</p>
      <input name="holder" autocomplete="off" />
      <label>Card number <input name="card" inputmode="numeric" autocomplete="off" placeholder="4242 4242 4242 4242" /></label>
      <label>Expiry date <input name="expiry" placeholder="MM/YY" /></label>
      <button type="submit">Save card</button>
      <p id="payment-status" role="status"></p>
    </form>
    <script>
      // Checks the card number and tells the parent page.
      document.getElementById('payment-form').addEventListener('submit', (event) => {
        event.preventDefault();
        const card = event.target.card.value.replace(/\s/g, '');
        const status = document.getElementById('payment-status');
        if (!/^\d{16}$/.test(card)) {
          status.textContent = 'Enter a 16-digit card number.';
          return;
        }
        status.textContent = `Card ending in ${card.slice(-4)} saved.`;
        parent.postMessage({ type: 'card-saved', last4: card.slice(-4) }, location.origin);
      });
    </script>
  </body>
</html>
