<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Help - Demo Shop</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page">
      <h1>Help</h1>
      <p>This page opens in a new tab. Use it to test tab handling.</p>
      <h2>Demo login</h2>
      <p>Username: <code>demo</code>. Password: <code>demo123</code>.</p>
      <p><a href="/">Back to the shop</a></p>
      <help-feedback></help-feedback>
    </main>
    <script>
      // Planted accessibility issue: a checkbox with no label, inside a shadow root.
      customElements.define(
        'help-feedback',
        class extends HTMLElement {
          connectedCallback() {
            this.attachShadow({ mode: 'open' }).innerHTML =
              '<p>Was this page helpful? <input type="checkbox" class="helpful" /></p>';
          }
        },
      );
    </script>
  </body>
</html>
